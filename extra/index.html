<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Static Web Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #007BFF;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      padding: 20px;
    }
    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 10px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
    h1, h2 {
      margin: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Static Web Page</h1>
  </header>

  <main>
    <h2>About This Page</h2>
    <p>This is a simple static web page created using HTML and CSS.</p>
    
    <h2>Features</h2>
    <ul>
      <li>No Python required</li>
      <li>Responsive design basics</li>
      <li>Clean layout</li>
    </ul>
  </main>

  <footer>
    &copy; 2025 My Static Site. All rights reserved.
  </footer>
</body>
</html>
